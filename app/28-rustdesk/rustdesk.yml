version: "3.8"

services:
  hbbs:
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server:latest}
    container_name: rustdesk-hbbs
    command: hbbs -r ${RUSTDESK_RELAY_SERVER:-192.168.9.3:21117}
    ports:
      - "${RUSTDESK_BIND_IP:-192.168.9.3}:21115:21115/tcp"
      - "${RUSTDESK_BIND_IP:-192.168.9.3}:21116:21116/tcp"
      - "${RUSTDESK_BIND_IP:-192.168.9.3}:21116:21116/udp"
    volumes:
      - ./data:/root
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server:latest}
    container_name: rustdesk-hbbr
    command: hbbr
    ports:
      - "${RUSTDESK_BIND_IP:-192.168.9.3}:21117:21117/tcp"
    volumes:
      - ./data:/root
    restart: unless-stopped
