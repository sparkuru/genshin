services:
  hedgedoc:
    image: lscr.io/linuxserver/hedgedoc:1.11.0
    container_name: hedgedoc
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      CMD_DOMAIN: ${CMD_DOMAIN:?Run ./init-hedgedoc.sh first}
      CMD_PROTOCOL_USESSL: ${CMD_PROTOCOL_USESSL:?Run ./init-hedgedoc.sh first}
      CMD_URL_ADDPORT: ${CMD_URL_ADDPORT:?Run ./init-hedgedoc.sh first}
      CMD_ALLOW_ORIGIN: ${CMD_ALLOW_ORIGIN:?Run ./init-hedgedoc.sh first}
      CMD_CSP_ENABLE: ${CMD_CSP_ENABLE:?Run ./init-hedgedoc.sh first}
      CMD_PORT: ${HEDGEDOC_APP_PORT:?Run ./init-hedgedoc.sh first}
      CMD_DOCUMENT_MAX_LENGTH: 100000000
      CMD_EMAIL: "true"
      CMD_ALLOW_EMAIL_REGISTER: "false"
      CMD_DB_URL: ${CMD_DB_URL:?Set CMD_DB_URL in .hedgedoc.env}
      UPLOADS_MODE: "0744"
      CMD_HSTS_ENABLE: "false"
      FILE__CMD_SESSION_SECRET: /config/secrets/session-secret
    volumes:
      - ./config:/config
    ports:
      - "${HEDGEDOC_BIND_IP:-0.0.0.0}:${HEDGEDOC_HOST_PORT:?Run ./init-hedgedoc.sh first}:${HEDGEDOC_APP_PORT:?Run ./init-hedgedoc.sh first}"
    restart: unless-stopped
