services:
  hedgedoc_db:
    image: mariadb:10.11
    container_name: hedgedoc_db
    environment:
      TZ: Asia/Shanghai
      MARIADB_ROOT_PASSWORD: ${HEDGEDOC_DB_ROOT_PASSWORD:?Run ./init-hedgedoc.sh first}
      MARIADB_DATABASE: hedgedoc
      MARIADB_USER: hedgedoc
      MARIADB_PASSWORD: ${HEDGEDOC_DB_PASSWORD:?Run ./init-hedgedoc.sh first}
    volumes:
      - ./db:/var/lib/mysql
    restart: unless-stopped
    networks:
      - hedgedoc_network

  hedgedoc:
    image: lscr.io/linuxserver/hedgedoc:1.11.0
    container_name: hedgedoc
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      CMD_DOMAIN: ${CMD_DOMAIN:?Run ./init-hedgedoc.sh first}
      CMD_PROTOCOL_USESSL: ${CMD_PROTOCOL_USESSL:?Run ./init-hedgedoc.sh first}
      CMD_URL_ADDPORT: ${CMD_URL_ADDPORT:?Run ./init-hedgedoc.sh first}
      CMD_ALLOW_ORIGIN: ${CMD_ALLOW_ORIGIN:?Run ./init-hedgedoc.sh first}
      CMD_CSP_ENABLE: ${CMD_CSP_ENABLE:?Run ./init-hedgedoc.sh first}
      CMD_PORT: ${HEDGEDOC_APP_PORT:?Run ./init-hedgedoc.sh first}
      CMD_DOCUMENT_MAX_LENGTH: 100000000
      CMD_EMAIL: "true"
      CMD_ALLOW_EMAIL_REGISTER: "true"
      CMD_DB_URL: mysql://hedgedoc:${HEDGEDOC_DB_PASSWORD:?Run ./init-hedgedoc.sh first}@hedgedoc_db:3306/hedgedoc
      UPLOADS_MODE: "0744"
      CMD_HSTS_ENABLE: "false"
      FILE__CMD_SESSION_SECRET: /config/secrets/session-secret
    volumes:
      - ./config:/config
    restart: unless-stopped
    networks:
      - hedgedoc_network
    depends_on:
      - hedgedoc_db

  nginx:
    image: nginx:alpine
    container_name: hedgedoc_nginx
    environment:
      HEDGEDOC_APP_PORT: ${HEDGEDOC_APP_PORT:?Run ./init-hedgedoc.sh first}
      NGINX_LISTEN_PORT: 80
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    command: >
      sh -c "envsubst '$$HEDGEDOC_APP_PORT $$NGINX_LISTEN_PORT' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    ports:
      - "${HEDGEDOC_BIND_IP:-0.0.0.0}:${HEDGEDOC_HOST_PORT:?Run ./init-hedgedoc.sh first}:80"
    restart: unless-stopped
    networks:
      - hedgedoc_network
    depends_on:
      - hedgedoc

networks:
  hedgedoc_network:
