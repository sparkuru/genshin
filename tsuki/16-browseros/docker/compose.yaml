services:
  neo:
    image: ghcr.io/browseros-ai/neo:latest
    hostname: neo
    shm_size: 1g
    stop_grace_period: 20s
    restart: unless-stopped
    ports:
      - "0.0.0.0:6080:6080"
    volumes:
      - ./data:/data
      - ./config/neo.toml:/etc/neo/neo.toml:ro
    environment:
      PUID: "1000"
      PGID: "1000"
      NEO_ARGS: "--no-proxy-server"

  mcp:
    image: nginx:1.29.8-alpine3.23
    restart: unless-stopped
    depends_on:
      neo:
        condition: service_healthy
    ports:
      - "0.0.0.0:9010:9010"
    volumes:
      - ./config/mcp-nginx.conf:/etc/nginx/nginx.conf:ro
